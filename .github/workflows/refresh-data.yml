name: Refresh market data

on:
  schedule:
    # HKT (UTC+8) 07:00-23:00 Mon-Fri, hourly. 07:00-07:59 HKT Monday is 23:00 UTC Sunday, so day-of-week shifts back one for the 23:00 UTC run.
    - cron: "0 23 * * 0-4"
    - cron: "0 0-15 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch prices and news
        run: python scripts/fetch_data.py
      - name: Commit changed data
        run: |
          git config user.name "market-data-bot"
          git config user.email "market-data-bot@users.noreply.github.com"
          git add data/market.json data/news.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refresh market data"
          git push
